name: Sync branches after PR merge

on:
  push:
    branches:
      - main  # Trigger when changes are pushed to `main` branch (i.e., when a PR is merged)

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the `main` branch
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch --all

      - name: Merge `main` into other branches
        run: |
          branches=$(git branch -r | grep -v 'main' | grep -v 'HEAD' | sed 's/origin\///')
          for branch in $branches; do
            echo "Merging latest `main` into $branch"
            git checkout $branch
            git merge origin/main --no-edit || true  
            git push origin $branch
          done
