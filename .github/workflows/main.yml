name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 

    - name: Determine changed files to test
      id: changed_files
      run: |
        echo "Changed files:"
        git fetch --unshallow || git fetch --all
    
        # Check if github.event.before is a valid commit
        if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
          echo "First commit on this branch, comparing with main"
          BASE_COMMIT=origin/main
        else
          BASE_COMMIT=${{ github.event.before }}
        fi
    
        # Get changed files
        git diff --name-only $BASE_COMMIT ${{ github.sha }} > changed_files.txt
        cat changed_files.txt

    - name: Run tests based on changed test files
      run: |
        for file in $(cat changed_files.txt); do
          if [[ "$file" == src/*.py ]]; then
            test_file="tests/test_$(basename $file)"
            echo "Running tests for $file in $test_file"
            pytest $test_file || true
          elif [[ "$file" == tests/*.py ]]; then
            echo "Running tests in $file"
            pytest $file || true
          else
            echo "$file is not a test file"
          fi
        done

    - name: Linting
      run: |
        echo "Running Flake8..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

